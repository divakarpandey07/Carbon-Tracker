services:
  - type: web
    name: carbontracker-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        value: supersecretcarbonjwtkey_2026_bairagi
      - key: FRONTEND_URL
        value: https://carbon-tracker-olive.vercel.app
